[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit INA260 Library@^1.5.3
	constiko/RTC RV-3028-C7 Arduino Library@^2.1.0
	andrewrapp/XBee@0.0.0-alpha+sha.39f236ea18
